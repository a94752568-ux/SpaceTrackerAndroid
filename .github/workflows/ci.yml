name: SpaceTracker CI/CD Pipeline

on:
  push:
    branches: [ main, ui/* ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verification & Protection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Execute Test Suite (Unit, UI Smoke, A11y, Map CSS, Ortho)
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Generate & Verify Asset Manifest
        run: node scripts/generate-manifest.mjs
